name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'member/**'
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    if: ${{ hashFiles('graduation-attainment-platform/frontend/package.json') != '' }}

    defaults:
      run:
        working-directory: graduation-attainment-platform/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graduation-attainment-platform/frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend-ci:
    name: Backend Build Check
    runs-on: ubuntu-latest
    if: ${{ hashFiles('graduation-attainment-platform/backend/pom.xml') != '' }}

    defaults:
      run:
        working-directory: graduation-attainment-platform/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build backend
        run: mvn -B clean package -DskipTests
