name: Frontend Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "member/**"
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check frontend project exists
        id: frontend-check
        shell: bash
        run: |
          if [ -f graduation-attainment-platform/frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graduation-attainment-platform/frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: graduation-attainment-platform/frontend
        run: npm ci

      - name: Build frontend
        if: steps.frontend-check.outputs.exists == 'true'
        working-directory: graduation-attainment-platform/frontend
        run: npm run build

      - name: Skip frontend build
        if: steps.frontend-check.outputs.exists != 'true'
        run: echo "Frontend project not initialized yet, skipping frontend build."
