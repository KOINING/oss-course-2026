services:
  frontend:
    build:
      context: ../frontend
    container_name: graduation-frontend
    restart: always

  nginx:
    image: nginx:stable
    container_name: graduation-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
    restart: always
